name: Reusable GitLab Docker Runner

on:
  workflow_call:
    inputs:
      workers:
        description: "Number of parallel GitHub Actions VM workers"
        required: false
        type: string
      wait_timeout:
        description: "Seconds to wait for a job before worker shuts down"
        required: false
        default: "35"
        type: string
    secrets:
      GITLAB_RUNNER_TOKEN:
        required: true
      GITLAB_URL:
        required: false

jobs:
  setup:
    name: Calculate Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.calc.outputs.matrix }}
      worker_count: ${{ steps.calc.outputs.worker_count }}
    steps:
      - id: calc
        env:
          MANUAL_INPUT: ${{ inputs.workers }}
          JIT_WORKERS: ${{ github.event.client_payload.workers }}
          CONFIG_MAX: ${{ vars.MAX_WORKERS || vars.WORKERS || '10' }}
        run: |
          COUNT=$(node -e "
            const manual = parseInt(process.env.MANUAL_INPUT, 10);
            const jit = parseInt(process.env.JIT_WORKERS, 10);
            const max = parseInt(process.env.CONFIG_MAX, 10) || 10;
            
            let chosen;
            if (!isNaN(manual) && manual > 0) {
              chosen = manual;
            } else if (!isNaN(jit) && jit > 0) {
              chosen = Math.min(jit, max);
            } else {
              chosen = Math.min(max, 2);
            }
            const bounded = Math.max(1, Math.min(20, chosen));
            console.log(bounded);
          ")
          echo "Determined JIT worker count: $COUNT (Stage: ${{ github.event.client_payload.stage || 'manual' }}, Requested: ${{ github.event.client_payload.workers || 'none' }})"
          MATRIX=$(node -e "console.log(JSON.stringify(Array.from({length: $COUNT}, (_, i) => i + 1)))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "worker_count=$COUNT" >> "$GITHUB_OUTPUT"

  worker:
    needs: setup
    name: Docker Worker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker_id: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Execute GitLab CI Jobs in Docker Container
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL || 'https://gitlab.com' }}
          GITLAB_RUNNER_TOKEN: ${{ secrets.GITLAB_RUNNER_TOKEN }}
          WAIT_TIMEOUT: ${{ inputs.wait_timeout || '35' }}
        run: |
          echo "🚀 Worker #${{ matrix.worker_id }}/${{ needs.setup.outputs.worker_count }} listening for GitLab CI jobs (timeout: ${WAIT_TIMEOUT}s)..."
          
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            gitlab/gitlab-runner:latest \
            run-single \
            --url "${GITLAB_URL}" \
            --token "${GITLAB_RUNNER_TOKEN}" \
            --executor docker \
            --docker-image "ubuntu:latest" \
            --docker-privileged \
            --docker-volumes "/var/run/docker.sock:/var/run/docker.sock" \
            --docker-volumes "/cache" \
            --wait-timeout "${WAIT_TIMEOUT}"

          echo "🏁 Worker #${{ matrix.worker_id }} finished. Exiting VM."
