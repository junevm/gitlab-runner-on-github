[settings]
lockfile = true

[tools]
node = "lts"
actionlint = "latest"
shellcheck = "latest"

[tasks.lint]
description = "Lint GitHub Actions workflows using actionlint"
run = "actionlint .github/workflows/*.yml"

[tasks."worker:dev"]
description = "Start local Cloudflare Worker development server"
dir = "cloudflare-worker"
run = "npx wrangler dev"

[tasks."worker:deploy"]
description = "Deploy Cloudflare Worker bridge to Cloudflare"
dir = "cloudflare-worker"
run = "npx wrangler deploy"

[tasks."worker:secret:pat"]
description = "Set GitHub Personal Access Token in Cloudflare Worker secrets"
dir = "cloudflare-worker"
run = "npx wrangler secret put GH_PAT"

[tasks."worker:secret:token"]
description = "Set optional GitLab Webhook secret token in Cloudflare Worker secrets"
dir = "cloudflare-worker"
run = "npx wrangler secret put GITLAB_SECRET_TOKEN"
